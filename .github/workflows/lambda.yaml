name: deploy-lambda

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lambda-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda/token-minter
          zip function.zip bootstrap

      - name: Upload Lambda package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lambda-package
          path: function.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lambda-production
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download Lambda package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lambda-package

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: arn:aws:iam::917497682277:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name token-minter \
            --zip-file fileb://function.zip
